image: node:24-bookworm-slim

stages:
  - verify
  - test
  - evidence

default:
  before_script:
    - npm ci

format_and_reference:
  stage: verify
  script:
    - npm run format:check
    - npm run check:reference

unit_and_integration_tests:
  stage: test
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    POSTGRES_PASSWORD: isolated-test-only
    POSTGRES_DB: trackwork_test
    TRACKWORK_TEST_DATABASE_URL: postgresql://postgres:isolated-test-only@postgres:5432/trackwork_test
  script:
    - npm test

reproducible_schedule_evidence:
  stage: evidence
  script:
    - npm run results
    - npm run benchmark
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - submissions/public/
      - submissions/benchmark.json
