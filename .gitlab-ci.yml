image: node:24-bookworm-slim

stages:
  - verify
  - test
  - evidence

default:
  before_script:
    - npm ci

format_and_reference:
  stage: verify
  script:
    - npm run format:check
    - npm run check:reference

unit_and_integration_tests:
  stage: test
  script:
    - npm test

reproducible_schedule_evidence:
  stage: evidence
  script:
    - npm run results
    - npm run benchmark
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - submissions/public/
      - submissions/benchmark.json
