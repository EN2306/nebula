services:
  trackwork:
    build: .
    image: trackwork:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      RAILSYNC_DB: /app/data/railsync.sqlite
    volumes:
      - trackwork-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  trackwork-data:
